# CircleCI verification and releases for Hclaro. The GitHub CI workflow remains only as a
# manual fallback.
#
# - Pull requests: full suite and browser checks on Linux; Go and unit tests on Windows and
#   macOS when Go code, fixtures, scripts or CI changed.
# - master: full suite on Linux, Windows and macOS.
# - Changes that touch only docs/, tasks/ or Markdown files stop after checkout.
# - Tags like v1.2.3 or v1.2.3-alpha.1: full suite on all three OSes, then cross-compile,
#   package, smoke-test the packages natively and publish a GitHub release.
#
# No orbs: every step is written here. Toolchains are downloaded from go.dev and
# nodejs.org at pinned versions and checked against pinned SHA-256 sums. The only
# credential is GITHUB_RELEASE_TOKEN, in the hclaro-release context, used by the publish
# job. Nothing here uses cloud accounts or a real Terraform/OpenTofu engine.
version: 2.1

executors:
  linux:
    docker:
      # Ubuntu 24.04: Playwright 1.58 (held for macOS 13 development) does not support 26.04.
      - image: cimg/base:2026.09-24.04@sha256:668174490adc470cd34eb3aa178939d65f817bc13ef657a94ff0278338f7d8da
    resource_class: medium
  windows:
    machine:
      image: windows-server-2022-gui:2026.10.2
    resource_class: windows.medium
    shell: bash.exe
  macos:
    macos:
      xcode: 27.1.0
    resource_class: m4pro.medium

parameters:
  go-version:
    type: string
    default: "1.27.2"
  node-version:
    type: string
    default: "24.22.1"
  github-repo:
    type: string
    default: botopsy/hclaro

commands:
  skip-unrelated-changes:
    description: Stop the job when the change touches nothing it tests.
    parameters:
      go-only:
        description: Run only when Go code, test fixtures, scripts or CI changed.
        type: boolean
        default: false
    steps:
      - run:
          name: Skip unrelated changes
          command: |
            # A release always runs everything.
            [ -z "${CIRCLE_TAG:-}" ] || exit 0
            if [ "$CIRCLE_BRANCH" = master ]; then
              base=HEAD^1
            else
              git fetch -q origin master && base=$(git merge-base origin/master HEAD) || exit 0
            fi
            # When the diff cannot be computed, run everything.
            changed=$(git diff --name-only "$base" HEAD) || exit 0
            [ -n "$changed" ] || exit 0
            # grep reads all input (no -q): under pipefail an early exit could kill printf
            # and make a match look like a miss.
            if [ "<< parameters.go-only >>" = true ]; then
              # fixtures/ is embedded into Go tests; scripts/ holds the fake engine and fixture server.
              relevant='\.go$|^go\.(mod|sum)$|^(scripts|fixtures|\.circleci)/'
              printf '%s\n' "$changed" | grep -E "$relevant" >/dev/null && exit 0
              echo "No Go code, fixtures, scripts or CI changed:"
            else
              printf '%s\n' "$changed" | grep -Ev '^(docs/|tasks/)|\.md$' >/dev/null && exit 0
              echo "Only documentation changed:"
            fi
            printf '  %s\n' $changed
            circleci-agent step halt

  toolchain:
    description: Install pinned Go and Node and point every cache at .cache/ in the checkout.
    parameters:
      os:
        type: enum
        enum: [linux, windows, macos]
    steps:
      - when:
          condition:
            equal: [linux, << parameters.os >>]
          steps:
            - run:
                name: Install Go and Node (Linux)
                command: |
                  set -euo pipefail
                  cd /tmp
                  curl -fsSLo go.tgz https://go.dev/dl/go<< pipeline.parameters.go-version >>.linux-amd64.tar.gz
                  echo "ecbadb99091a3f46e31f5f934b068b1864eafa7995211b39eaddf76996045fe5  go.tgz" | sha256sum -c -
                  curl -fsSLo node.tgz https://nodejs.org/dist/v<< pipeline.parameters.node-version >>/node-v<< pipeline.parameters.node-version >>-linux-x64.tar.gz
                  echo "eb6728e77c576a35162c122c45ccadf224d89ff00abc8dae46cc2897c6002d7c  node.tgz" | sha256sum -c -
                  mkdir -p "$HOME/sdk/node"
                  tar -C "$HOME/sdk" -xzf go.tgz
                  tar -C "$HOME/sdk/node" --strip-components=1 -xzf node.tgz
                  # The race detector needs a C toolchain.
                  command -v gcc >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends gcc libc6-dev; }
                  echo 'export PATH="$HOME/sdk/go/bin:$HOME/sdk/node/bin:$PATH"' >> "$BASH_ENV"
                  echo 'export ROOT="$PWD"' >> "$BASH_ENV"
      - when:
          condition:
            equal: [macos, << parameters.os >>]
          steps:
            - run:
                name: Install Go and Node (macOS)
                command: |
                  set -euo pipefail
                  cd /tmp
                  curl -fsSLo go.tgz https://go.dev/dl/go<< pipeline.parameters.go-version >>.darwin-arm64.tar.gz
                  echo "76812b213b1b2302c978d28fa52fa92d541704b9e7d9d5db8002c50e4018c4c5  go.tgz" | shasum -a 256 -c -
                  curl -fsSLo node.tgz https://nodejs.org/dist/v<< pipeline.parameters.node-version >>/node-v<< pipeline.parameters.node-version >>-darwin-arm64.tar.gz
                  echo "89c682593d76cd44233fa53b1563264e7de9cbb189cad169135c5b4fadfbc0a7  node.tgz" | shasum -a 256 -c -
                  mkdir -p "$HOME/sdk/node"
                  tar -C "$HOME/sdk" -xzf go.tgz
                  tar -C "$HOME/sdk/node" --strip-components=1 -xzf node.tgz
                  echo 'export PATH="$HOME/sdk/go/bin:$HOME/sdk/node/bin:$PATH"' >> "$BASH_ENV"
                  echo 'export ROOT="$PWD"' >> "$BASH_ENV"
      - when:
          condition:
            equal: [windows, << parameters.os >>]
          steps:
            - run:
                name: Install Go and Node (Windows)
                command: |
                  set -euo pipefail
                  sdk="$HOME/sdk"; mkdir -p "$sdk"; cd "$sdk"
                  curl -fsSLo go.zip https://go.dev/dl/go<< pipeline.parameters.go-version >>.windows-amd64.zip
                  echo "1314008898bd40df77af4b014f777f08873dbdfbcd3d92308728ee03304fe04f  go.zip" | sha256sum -c -
                  curl -fsSLo node.zip https://nodejs.org/dist/v<< pipeline.parameters.node-version >>/node-v<< pipeline.parameters.node-version >>-win-x64.zip
                  echo "d2046d28c2c3dcd211ac5145c0bf30e2047ef9dfb306693c8c6e2eccd8b95fa5  node.zip" | sha256sum -c -
                  # Windows' own bsdtar reads zip archives; PowerShell's Expand-Archive takes minutes.
                  wintar="$(cygpath -u "$SYSTEMROOT")/System32/tar.exe"
                  "$wintar" -xf "$(cygpath -w "$sdk/go.zip")" -C "$(cygpath -w "$sdk")"
                  "$wintar" -xf "$(cygpath -w "$sdk/node.zip")" -C "$(cygpath -w "$sdk")"
                  mv "node-v<< pipeline.parameters.node-version >>-win-x64" node
                  echo "export PATH=\"$sdk/go/bin:$sdk/node:\$PATH\"" >> "$BASH_ENV"
                  # Go and Node are native Windows programs and need Windows paths.
                  echo 'export ROOT="$(cygpath -m "$PWD")"' >> "$BASH_ENV"
      - run:
          name: Point caches at the checkout
          command: |
            {
              echo 'export GOCACHE="$ROOT/.cache/go"'
              echo 'export GOMODCACHE="$ROOT/.cache/gomod"'
              echo 'export npm_config_cache="$ROOT/.cache/npm"'
              echo 'export PLAYWRIGHT_BROWSERS_PATH="$ROOT/.cache/ms-playwright"'
            } >> "$BASH_ENV"
            source "$BASH_ENV"
            go version
            node --version

  restore-caches:
    parameters:
      os:
        type: string
    steps:
      - restore_cache:
          keys:
            - go-v1-<< parameters.os >>-{{ checksum "go.mod" }}
            - go-v1-<< parameters.os >>-
      - restore_cache:
          keys:
            - npm-v1-<< parameters.os >>-{{ checksum "web/package-lock.json" }}

  save-caches:
    parameters:
      os:
        type: string
    steps:
      - save_cache:
          key: go-v1-<< parameters.os >>-{{ checksum "go.mod" }}
          paths: [.cache/go, .cache/gomod]
      - save_cache:
          key: npm-v1-<< parameters.os >>-{{ checksum "web/package-lock.json" }}
          paths: [.cache/npm]

jobs:
  verify:
    parameters:
      os:
        type: enum
        enum: [linux, windows, macos]
      # Typecheck, lint, the production build and the embedded-asset check are
      # OS-independent and run once, on Linux.
      static:
        type: boolean
        default: false
      browser:
        type: boolean
        default: false
      go-only:
        type: boolean
        default: false
    executor: << parameters.os >>
    steps:
      - checkout
      - skip-unrelated-changes:
          go-only: << parameters.go-only >>
      - toolchain:
          os: << parameters.os >>
      - restore-caches:
          os: << parameters.os >>
      - run:
          name: Install frontend dependencies
          command: npm ci --prefix web --no-audit --no-fund
      - run:
          name: Go tests
          # The race detector needs cgo, and the Windows image has no C compiler. Races are
          # checked on Linux for every change and on macOS for master; Windows runs the same
          # tests without -race for platform behavior (paths, permissions, CTRL_BREAK).
          command: |
            if [ "<< parameters.os >>" = windows ]; then race=; else race=-race; fi
            go test $race ./cmd/... ./internal/... ./scripts/...
      - run:
          name: Go vet
          command: go vet ./cmd/... ./internal/... ./scripts/...
      - run:
          name: Vitest
          command: npm --prefix web test
      - when:
          condition: << parameters.static >>
          steps:
            - run:
                name: Typecheck and lint
                command: npm --prefix web run typecheck && npm --prefix web run lint
            - run:
                name: Production build
                command: npm --prefix web run build
            - run:
                name: Embedded assets match a fresh build
                command: git diff --exit-code -- internal/ui/dist
      - when:
          condition: << parameters.browser >>
          steps:
            - run:
                name: Build embedded host binary
                command: CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags='-s -w' -o bin/hclaro ./cmd/hclaro
            - restore_cache:
                keys:
                  - playwright-v1-<< parameters.os >>-{{ checksum "web/package-lock.json" }}
            - run:
                name: Install test browser
                command: |
                  # --with-deps installs system libraries on Linux only.
                  if [ "<< parameters.os >>" = linux ]; then deps=--with-deps; else deps=; fi
                  npm --prefix web exec -- playwright install $deps chromium
            - save_cache:
                key: playwright-v1-<< parameters.os >>-{{ checksum "web/package-lock.json" }}
                paths: [.cache/ms-playwright]
            - run:
                name: Synthetic browser checks
                command: |
                  suffix=""; if [ "<< parameters.os >>" = windows ]; then suffix=".exe"; fi
                  go build -o "bin/fixture-http${suffix}" ./scripts/fixture-http
                  node scripts/browser-smoke.mjs
            - store_artifacts:
                path: docs/screenshots
                destination: screenshots
      - save-caches:
          os: << parameters.os >>
      - store_artifacts:
          path: .cache/browser-failure.png
          destination: browser-failure.png

  release-build:
    executor: linux
    steps:
      - checkout
      - run:
          name: Validate tag
          command: |
            if ! printf '%s' "$CIRCLE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "Tag '$CIRCLE_TAG' is not a semantic version like v1.2.3 or v1.2.3-alpha.1"; exit 1
            fi
      - toolchain:
          os: linux
      - restore-caches:
          os: linux
      - run:
          name: Install frontend dependencies
          command: npm ci --prefix web --no-audit --no-fund
      - run:
          name: Embedded assets match a fresh build
          command: npm --prefix web run build && git diff --exit-code -- internal/ui/dist
      - run:
          name: Cross-compile
          command: make cross VERSION="${CIRCLE_TAG#v}"
      - run:
          name: Package
          command: |
            set -euo pipefail
            command -v zip >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends zip; }
            VERSION="${CIRCLE_TAG#v}"
            mkdir -p release
            for bin in dist/hclaro-*; do
              target="${bin#dist/hclaro-}"; target="${target%.exe}"
              name="hclaro_${VERSION}_${target//-/_}"
              stage="release/stage/$name"
              mkdir -p "$stage"
              exe=hclaro; case "$target" in windows-*) exe=hclaro.exe ;; esac
              cp "$bin" "$stage/$exe"
              cp README.md SECURITY.md CHANGELOG.md internal/ui/dist/THIRD-PARTY-NOTICES.txt "$stage/"
              # Fixed mtimes and ownership keep archives reproducible for a given commit.
              find "$stage" -exec touch -d "@$(git log -1 --format=%ct)" {} +
              case "$target" in
                windows-*) (cd release/stage && zip -qrX "../$name.zip" "$name") ;;
                *) tar -C release/stage --sort=name --owner=0 --group=0 --numeric-owner -czf "release/$name.tar.gz" "$name" ;;
              esac
            done
            rm -rf release/stage
            (cd release && sha256sum hclaro_* > "hclaro_${VERSION}_checksums.txt")
            cat "release/hclaro_${VERSION}_checksums.txt"
      - persist_to_workspace:
          root: .
          paths: [release]
      - store_artifacts:
          path: release
          destination: release

  release-smoke:
    # Run each packaged binary natively. Linux arm64 and macOS amd64 are cross-compiled only.
    parameters:
      os:
        type: enum
        enum: [linux, windows, macos]
      target:
        type: string
      ext:
        type: string
    executor: << parameters.os >>
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Verify checksum and run --version
          command: |
            set -euo pipefail
            VERSION="${CIRCLE_TAG#v}"
            cd release
            name="hclaro_${VERSION}_<< parameters.target >>"
            line=$(grep " $name.<< parameters.ext >>\$" "hclaro_${VERSION}_checksums.txt")
            if command -v sha256sum >/dev/null; then echo "$line" | sha256sum -c -; else echo "$line" | shasum -a 256 -c -; fi
            case "<< parameters.os >>" in
              windows) "$(cygpath -u "$SYSTEMROOT")/System32/tar.exe" -xf "$name.zip"; exe="$name/hclaro.exe" ;;
              *) tar -xzf "$name.tar.gz"; exe="$name/hclaro" ;;
            esac
            out="$("$exe" --version | tr -d '\r')"
            echo "$out"
            [ "$out" = "hclaro $VERSION" ]

  release-publish:
    executor: linux
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Publish GitHub release
          # GITHUB_RELEASE_TOKEN comes from the hclaro-release context, which only this job uses.
          command: |
            set -euo pipefail
            : "${GITHUB_RELEASE_TOKEN:?Add GITHUB_RELEASE_TOKEN to the hclaro-release context}"
            VERSION="${CIRCLE_TAG#v}"
            api="https://api.github.com/repos/<< pipeline.parameters.github-repo >>"
            gh() { curl -fsS -H "Authorization: Bearer $GITHUB_RELEASE_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }
            # The tag must already exist on GitHub (like gh release create --verify-tag).
            gh "$api/git/ref/tags/$CIRCLE_TAG" >/dev/null
            # Any pre-release suffix (alpha, beta, rc) is published as a GitHub pre-release.
            prerelease=false; case "$VERSION" in *-*) prerelease=true ;; esac
            body=$(jq -n --arg tag "$CIRCLE_TAG" --arg name "Hclaro $VERSION" --argjson pre "$prerelease" \
              '{tag_name: $tag, name: $name, prerelease: $pre, draft: true, generate_release_notes: true}')
            # Created as a draft and published only after every archive is attached.
            created=$(gh -X POST "$api/releases" -d "$body")
            id=$(printf '%s' "$created" | jq -r .id)
            upload=$(printf '%s' "$created" | jq -r .upload_url); upload="${upload%%\{*}"
            for f in release/*; do
              gh -X POST -H "Content-Type: application/octet-stream" --data-binary "@$f" "$upload?name=$(basename "$f")" >/dev/null
              echo "Uploaded $(basename "$f")"
            done
            gh -X PATCH "$api/releases/$id" -d '{"draft": false}' | jq -r .html_url

workflows:
  pull-request:
    when:
      and:
        - not:
            equal: [master, << pipeline.git.branch >>]
        - not: << pipeline.git.tag >>
    jobs:
      - verify:
          name: linux
          os: linux
          static: true
          browser: true
      # Windows and macOS run on pull requests only when Go code changes; master and
      # releases always run them.
      - verify:
          name: windows-unit
          os: windows
          go-only: true
      - verify:
          name: macos-unit
          os: macos
          go-only: true

  master:
    when:
      equal: [master, << pipeline.git.branch >>]
    jobs:
      - verify:
          name: linux
          os: linux
          static: true
          browser: true
      - verify:
          name: windows
          os: windows
          browser: true
      - verify:
          name: macos
          os: macos
          browser: true

  release:
    when:
      matches:
        pattern: "^v[0-9].*$"
        value: << pipeline.git.tag >>
    # Jobs run on a tag push only with their own tag filter; `when` alone is not enough.
    jobs:
      - verify:
          filters:
            tags:
              only: /^v[0-9].*/
          name: release-linux
          os: linux
          static: true
          browser: true
      - verify:
          filters:
            tags:
              only: /^v[0-9].*/
          name: release-windows
          os: windows
          browser: true
      - verify:
          filters:
            tags:
              only: /^v[0-9].*/
          name: release-macos
          os: macos
          browser: true
      - release-build:
          filters:
            tags:
              only: /^v[0-9].*/
          requires: [release-linux, release-windows, release-macos]
      - release-smoke:
          filters:
            tags:
              only: /^v[0-9].*/
          name: smoke-linux
          os: linux
          target: linux_amd64
          ext: tar.gz
          requires: [release-build]
      - release-smoke:
          filters:
            tags:
              only: /^v[0-9].*/
          name: smoke-macos
          os: macos
          target: darwin_arm64
          ext: tar.gz
          requires: [release-build]
      - release-smoke:
          filters:
            tags:
              only: /^v[0-9].*/
          name: smoke-windows
          os: windows
          target: windows_amd64
          ext: zip
          requires: [release-build]
      - release-publish:
          filters:
            tags:
              only: /^v[0-9].*/
          context: hclaro-release
          requires: [smoke-linux, smoke-macos, smoke-windows]
