name: M1 checks
# Pull requests, master and releases run on CircleCI (.circleci/config.yml). This workflow
# is a manual fallback only.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every OS on failure instead of cancelling the rest.
      fail-fast: false
      matrix:
        # Ubuntu is pinned: Playwright 1.58 (held for macOS 13 development) does not support ubuntu-latest (26.04).
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      # Actions are pinned to release commits; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install frontend dependencies
        run: npm ci --prefix web
      - run: go test -race ./cmd/... ./internal/... ./scripts/...
      - run: go vet ./cmd/... ./internal/... ./scripts/...
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run lint
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - name: Embedded assets match a fresh build
        if: runner.os == 'Linux'
        run: git diff --exit-code -- internal/ui/dist
      - name: Build embedded host binary
        shell: bash
        run: CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags='-s -w' -o bin/hclaro ./cmd/hclaro
      - name: Install test browser
        run: npm --prefix web exec -- playwright install --with-deps chromium
      - name: Synthetic browser checks
        shell: bash
        run: |
          suffix=""; if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          go build -o "bin/fixture-http${suffix}" ./scripts/fixture-http
          node scripts/browser-smoke.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence-${{ matrix.os }}
          path: docs/screenshots/
