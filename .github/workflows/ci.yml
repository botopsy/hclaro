name: M1 checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: npm ci --prefix web
      - run: go test -race ./cmd/... ./internal/... ./scripts/...
      - run: go vet ./cmd/... ./internal/... ./scripts/...
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run lint
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - name: Build embedded host binary
        shell: bash
        run: CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags='-s -w' -o bin/hclaro ./cmd/hclaro
      - name: Install test browser
        run: npm --prefix web exec -- playwright install --with-deps chromium
      - name: Synthetic browser checks
        shell: bash
        run: |
          suffix=""; if [ "$RUNNER_OS" = "Windows" ]; then suffix=".exe"; fi
          go build -o "bin/fixture-http${suffix}" ./scripts/fixture-http
          node scripts/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}
          path: docs/screenshots/
