name: Release
# Push a tag like v0.2.0 or v0.2.0-alpha.1 to publish downloadable binaries.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    # The full CI suite must pass on every OS before anything is built for release.
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Validate tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Tag '$TAG' is not a semantic version like v1.2.3 or v1.2.3-alpha.1"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Install frontend dependencies
        run: npm ci --prefix web
      - run: npm --prefix web run build
      - name: Embedded assets match a fresh build
        run: git diff --exit-code -- internal/ui/dist
      - name: Cross-compile
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: make cross VERSION="$VERSION"
      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          for bin in dist/hclaro-*; do
            target="${bin#dist/hclaro-}"; target="${target%.exe}"
            name="hclaro_${VERSION}_${target//-/_}"
            stage="release/stage/$name"
            mkdir -p "$stage"
            exe=hclaro; case "$target" in windows-*) exe=hclaro.exe ;; esac
            cp "$bin" "$stage/$exe"
            cp README.md SECURITY.md CHANGELOG.md internal/ui/dist/THIRD-PARTY-NOTICES.txt "$stage/"
            # Fixed mtimes and ownership keep archives reproducible for a given commit.
            find "$stage" -exec touch -d "@$(git log -1 --format=%ct)" {} +
            case "$target" in
              windows-*) (cd release/stage && zip -qrX "../$name.zip" "$name") ;;
              *) tar -C release/stage --sort=name --owner=0 --group=0 --numeric-owner -czf "release/$name.tar.gz" "$name" ;;
            esac
          done
          rm -rf release/stage
          (cd release && sha256sum hclaro_* > "hclaro_${VERSION}_checksums.txt")
          cat "release/hclaro_${VERSION}_checksums.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: release/
          if-no-files-found: error

  smoke:
    # Run each packaged binary natively. Linux arm64 and macOS amd64 are cross-compiled only: no runner here.
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: linux_amd64, ext: tar.gz }
          - { os: macos-latest, target: darwin_arm64, ext: tar.gz }
          - { os: windows-latest, target: windows_amd64, ext: zip }
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-packages
          path: release
      - name: Verify checksum and run --version
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
        run: |
          cd release
          name="hclaro_${VERSION}_${TARGET}"
          grep " $name.$EXT\$" "hclaro_${VERSION}_checksums.txt" | sha256sum -c - 2>/dev/null \
            || grep " $name.$EXT\$" "hclaro_${VERSION}_checksums.txt" | shasum -a 256 -c -
          if [ "$EXT" = zip ]; then unzip -q "$name.zip"; exe="$name/hclaro.exe"; else tar -xzf "$name.tar.gz"; exe="$name/hclaro"; fi
          out="$("$exe" --version)"
          echo "$out"
          [ "$out" = "hclaro $VERSION" ]

  publish:
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-packages
          path: release
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          flags=()
          # Any pre-release suffix (alpha, beta, rc) is published as a GitHub pre-release.
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" release/* \
            --verify-tag \
            --title "Hclaro $VERSION" \
            --generate-notes \
            "${flags[@]}"
